name: Validate and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate integration and publish a new version
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python source syntax
        run: python -m compileall -q custom_components/modbus_usb

      - name: Create tag and GitHub Release from manifest version
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const manifest = JSON.parse(
              fs.readFileSync("custom_components/modbus_usb/manifest.json", "utf8")
            );
            const tag = String(manifest.version);
            let releaseNotes = "";
            if (fs.existsSync("CHANGELOG.md")) {
              const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
              const start = lines.findIndex((line) => line.trim() === `## ${tag}`);
              if (start !== -1) {
                const end = lines.findIndex(
                  (line, index) => index > start && line.startsWith("## ")
                );
                releaseNotes = lines.slice(start + 1, end === -1 ? lines.length : end).join("\n").trim();
              }
            }
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              ...(releaseNotes
                ? { body: releaseNotes, generate_release_notes: false }
                : { generate_release_notes: true }),
            };

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Version ${tag} already exists; no release was changed.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });
            await github.rest.repos.createRelease(release);
            core.info(`Created tag and release ${tag}`);

name: Tests

on:
  pull_request:
    branches: [Dev, main]
  push:
    branches: [Dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / Pymodbus ${{ matrix.pymodbus }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        pymodbus: ["3.6.9", "3.15.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt "pymodbus==${{ matrix.pymodbus }}"
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: python -m pytest -q
      - name: Check source syntax
        run: python -m compileall -q custom_components/modbus_usb

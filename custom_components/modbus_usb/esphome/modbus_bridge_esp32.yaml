# ─────────────────────────────────────────────────────────────────────────────
# Modbus USB Controller — ESPHome RS-485 bridge (RTU over TCP)   [recommended]
#
# An ESP32 with a MAX485 / auto-direction RS-485 module becomes the Modbus hub
# for Home Assistant's "Modbus USB Controller" integration: the ESP forwards
# raw UART bytes to a TCP stream server and Home Assistant talks Modbus RTU
# over that socket. All integration features (polling, writes, RS-485 scanner,
# board tools, Traffic Inspector byte capture) work exactly as with a USB adapter.
#
# Home Assistant hub settings:
#   Transport ............ ESPHome · RTU over TCP
#   Host ................. ${name}.local (or the device IP / DHCP reservation)
#   Stream server port ... ${tcp_port}
#   Baud / parity / stop . MUST equal the uart: block below
#
# Wiring (ESP32 devkit, UART2):
#   MAX485 module  : DI ← GPIO17 (TX) · RO → GPIO16 (RX) · DE+RE ← GPIO4
#                    (uncomment flow_control_pin below) · VCC 3V3/5V · GND
#   Auto-direction : TXD ← GPIO17 · RXD → GPIO16 · no DE/RE pin needed
#   RS-485 A/B to every slave A/B; 120 Ω termination at both bus ends; share GND.
#
# Requires the external component github://oxan/esphome-stream-server.
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  name: modbus-bridge
  friendly_name: Modbus RS-485 Bridge
  uart_tx: GPIO17
  uart_rx: GPIO16
  uart_baud: "9600"
  uart_parity: "NONE"        # NONE | EVEN | ODD  (HA: N | E | O)
  uart_stop_bits: "1"
  tcp_port: "8899"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Modbus RTU over TCP bridge for Home Assistant Modbus USB Controller

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Modbus timeouts are short — never let the radio sleep between frames.
  power_save_mode: none
  fast_connect: true
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  # Keep UART0 quiet and avoid log-induced jitter on the bus.
  baud_rate: 0
  level: INFO

external_components:
  - source: github://oxan/esphome-stream-server
    components: [stream_server]

uart:
  id: modbus_uart
  tx_pin: ${uart_tx}
  rx_pin: ${uart_rx}
  baud_rate: ${uart_baud}
  data_bits: 8
  parity: ${uart_parity}
  stop_bits: ${uart_stop_bits}
  rx_buffer_size: 512

stream_server:
  id: modbus_stream
  uart_id: modbus_uart
  port: ${tcp_port}
  buffer_size: 512
  # MAX485 boards with DE/RE: drive both pins from one GPIO and uncomment.
  # flow_control_pin: GPIO4

binary_sensor:
  - platform: stream_server
    stream_server: modbus_stream
    connected:
      name: "${friendly_name} Client Connected"
  - platform: status
    name: "${friendly_name} Status"

sensor:
  - platform: stream_server
    stream_server: modbus_stream
    connection_count:
      name: "${friendly_name} Connections"
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "${friendly_name} Uptime"

button:
  - platform: restart
    name: "${friendly_name} Restart"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"

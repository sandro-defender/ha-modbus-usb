# Eletechsup 23IOC24_NPN — 24DI / 24DO NPN RS-485 remote I/O module
#
# Factory-default Command 1 protocol: M0 OPEN, FC03 reads and FC06 writes.
# Output registers are zero-based: 0–23 for CH-01–CH-24.
# Write values: 0x0100 (256) = ON, 0x0200 (512) = OFF.
# Input registers are 0x0080–0x0097 (128–151) for DI-01–DI-24.
#
# This untested template intentionally does not use Command 2 / M0 shorted.

id: eletechsup-23IOC24_NPN
image: "/modbus_usb_panel/images/eletechsup-23ioc24.jpg"
name: eletechsup 23IOC24_NPN I/O Board
manufacturer: eletechsup
model: 23IOC24_NPN
tested: false
default_slave_id: 1
info_url: "https://eletechsup.com/products/23ioa08-23iob16-23ioc24-23ioe48-8-16-24-32-48ch-multifunction-rs485-remote-io-module-plc-di-do-expansion-board-din-rail-box-standard-modbus-rtu-protocol"
description: >
  Unverified template for Eletechsup's 23IOC24_NPN 24DI / 24DO RS-485 remote
  I/O board. It uses the documented factory-default Command 1 protocol (M0
  open): FC03 reads and FC06 writes holding registers. Includes 24 NPN
  transistor outputs and 24 optically isolated NPN inputs. Default serial
  setup is 9600 baud, 8N1. Verify the wiring and outputs on a non-critical
  load before using it in automations.

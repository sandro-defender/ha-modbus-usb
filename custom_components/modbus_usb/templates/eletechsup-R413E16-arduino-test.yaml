# Eletechsup R413E16 test board — mapping verified against the supplied
# ArduinoModbus holdingRegisterWrite() example.
# FC06, holding registers 1..16: 0x0100 (256) = ON, 0x0200 (512) = OFF.
# The Arduino sketch uses slave 0x01. Change the slave ID in the Add Device
# screen if your board has been configured with a different Modbus address.
id: eletechsup-R413E16-arduino-test
name: eletechsup R413E16 Arduino Test Board
manufacturer: eletechsup
model: R413E16
default_slave_id: 1
image: "https://eletechsup.com/cdn/shop/files/10_d5e79182-bd7f-4923-9a48-3494c9c7af1d.jpg?v=1740746147&width=600"
info_url: "https://eletechsup.com/products/r413e16-rs485-relay-16ch-multifunction-npn-pnp-io-control-core-board-modbus-rtu-eletechsup-oem-odm?_pos=21&_sid=7b35d3777&_ss=r"
description: >
  Test mapping from the ArduinoModbus example: FC06 holding-register commands.
  Use only with outputs that are safe to energize. The board is command-only,
  so switches keep their last requested state and are not polled.
entities:
  - &channel
    name: Channel 01
    entity_type: switch
    register_type: holding
    address: 1
    data_type: uint16
    on_value: 256
    off_value: 512
    assumed_state: true
  - <<: *channel
    name: Channel 02
    address: 2
  - <<: *channel
    name: Channel 03
    address: 3
  - <<: *channel
    name: Channel 04
    address: 4
  - <<: *channel
    name: Channel 05
    address: 5
  - <<: *channel
    name: Channel 06
    address: 6
  - <<: *channel
    name: Channel 07
    address: 7
  - <<: *channel
    name: Channel 08
    address: 8
  - <<: *channel
    name: Channel 09
    address: 9
  - <<: *channel
    name: Channel 10
    address: 10
  - <<: *channel
    name: Channel 11
    address: 11
  - <<: *channel
    name: Channel 12
    address: 12
  - <<: *channel
    name: Channel 13
    address: 13
  - <<: *channel
    name: Channel 14
    address: 14
  - <<: *channel
    name: Channel 15
    address: 15
  - <<: *channel
    name: Channel 16
    address: 16

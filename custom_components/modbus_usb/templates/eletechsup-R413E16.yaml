# eletechsup R413E16 — 16-channel RS-485 Modbus RTU I/O core
# Protocol (FC06 write single holding register), matching the ESPHome payload:
#   slave, 0x06, addr_hi=0x00, addr_lo=channel, value_hi=0x01/0x02, value_lo=0x00
# Channel registers are 1–16 (not 0-based). ON = 256 (0x0100), OFF = 512 (0x0200).
# Reads are skipped (assumed_state) because this board is command-oriented.
#
# Changelog:
# 2026-09-06 — Initial template from ESPHome rs485 AC-01..AC-16 mapping.
# Date modified: 2026-09-06

id: eletechsup-R413E16
name: eletechsup R413E16
manufacturer: eletechsup
model: R413E16
default_slave_id: 1
image: "https://imgs.search.brave.com/Mv_-MbM7yrtYml5FvfXdpI7A9t_Bgdh4aO-7A3BbTzk/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLmVi/YXlpbWcuY29tL2lt/YWdlcy9nL05wQUFB/T1N3N2E5ZVNneG4v/cy1sNTAwLmpwZw"
description: >
  16-channel RS-485 Modbus RTU I/O core (A+/B-). Each AC channel is a holding
  register switch: write 0x0100 to turn on, 0x0200 to turn off (function code 06).
entities:
  - name: AC-01
    entity_type: switch
    register_type: holding
    address: 1
    data_type: uint16
    on_value: 256
    off_value: 512
    assumed_state: true

# Eletechsup R4D6F20 — 20-channel RS-485 Modbus RTU relay / I/O board
#
# This is a combined two-mode template.  M0 OPEN selects the factory-default
# Command 1 map; M0 shorted selects the documented Command 2 coil map from the
# same manual.  Select the physical jumper state in Board Tools so the matching
# entity map is installed.
#
# Channel writes: 0x0100 (256) = OPEN / ON, 0x0200 (512) = CLOSE / OFF.
# Channel reads: FC03 returns 1 = ON and 0 = OFF.
#
# Source: Eletechsup R4D6F20 Command 1 manual (see the matching .md file).

image: "/modbus_usb_panel/images/eletechsup R4D6F20.webp"

id: eletechsup-R4D6F20
name: eletechsup R4D6F20 Multifunction Relay Board
manufacturer: eletechsup
model: R4D6F20
tested: true
status: tested
default_slave_id: 1
default_baudrate: 9600
m0_short: false  # Command 1 template requires M0 open.
info_url: "https://eletechsup.com/products/r4d6f20-smart-20-channel-rs485-relay-board-with-plc-io-module-modbus-for-multifunction-control"
description: >
  Hardware-certified template for Eletechsup's 20-relay R4D6F20 PLC I/O board. It uses
  the documented factory-default Command 1 protocol (M0 open): FC03 reads and
  FC06 writes holding registers. Includes 20 relay outputs with live state
  reads, two PNP digital inputs, one 4–20 mA input, and one 0–10 V input.
  Default serial setup is 9600 baud, 8N1. Verify it on a non-critical load
  before relying on the configuration.
device_controls:
  protocol: eletechsup_r4d6f20
  m0:
    label: "M0 jumper is shorted (Command 2 mode)"
    description: >
      M0 open installs Command 1 holding-register relays. M0 shorted installs
      Command 2 relay coils and discrete inputs. Match the physical jumper;
      saving changes the Home Assistant profile and sends no M0 command.
    open_description: >
      Command 1 / M0 open: CH-01–CH-20 use holding registers 0–19 and the
      relay action controls are available. Saving installs this profile only.
    shorted_description: >
      Command 2 / M0 shorted: CH-01–CH-20 use coils 0–19 and DI-01–DI-02 use
      discrete inputs 0–1. Saving installs this profile only.
    save_command: r4d6f20_set_mode
    install_profile_on_create: true
  command_modes:
    command_1:
      m0_short: false
      label: "Command 1 — M0 open"
      read_functions: [3]
      write_functions: [6, 16]
      relay:
        register_type: holding
        address_start: 0
        on_value: 256
        off_value: 512
      digital_input:
        register_type: holding
        address_start: 128
    command_2:
      m0_short: true
      label: "Command 2 — M0 shorted"
      read_functions: [1, 2, 3, 4]
      write_functions: [5, 6, 15, 16]
      relay:
        register_type: coil
        address_start: 0
      digital_input:
        register_type: discrete
        address_start: 0
      analog_input:
        register_type: input
        address_start: 0
  channel_actions:
    toggle: 768
    interlock: 1024
    momentary: 1280
    delay_base: 1536
  baud_rate:
    address: 254
    values: {1200: 0, 2400: 1, 4800: 2, 9600: 3, 19200: 4, 38400: 5, 57600: 6, 115200: 7}
  parity:
    address: 255
    values: {"N": 0, "O": 1, "E": 2}
  slave_id:
    address: 253
    read_only: true
  factory_reset:
    address: 251
    value: 0

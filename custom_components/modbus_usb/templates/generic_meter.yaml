id: generic_meter
name: Generic Modbus Controller / Meter
manufacturer: Generic
model: Modbus RTU Device
default_slave_id: 1
description: Template for generic Modbus RTU sensor and setpoint controllers
entities:
  - name: Measured Value 1
    entity_type: sensor
    register_type: holding
    address: 0
    data_type: uint16
    scale: 1
    unit_of_measurement: ""
    state_class: measurement
  - name: Target Setpoint
    entity_type: number
    register_type: holding
    address: 1
    data_type: uint16
    scale: 1
    min_value: 0
    max_value: 100
    step: 1
    mode: slider
  - name: Power Switch
    entity_type: switch
    register_type: coil
    address: 0
  - name: Alarm Status
    entity_type: binary_sensor
    register_type: discrete
    address: 0
    device_class: problem
